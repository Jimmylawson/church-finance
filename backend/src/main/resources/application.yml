spring:
  application:
    name: finance-backend
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://localhost:55432/church_finance
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jwt:
    secret-key: tOrjDDJT7Q0JINTfr2V83eWJ6Pl4ljhXNZc7IvN7wdM=
    access-expiration: 3600000
    refresh-expiration: 86400000
    issuer: finance-backend

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
              - openid
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}




