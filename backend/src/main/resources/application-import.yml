spring:
  datasource:
    url: jdbc:postgresql://localhost:55432/church_finance
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:import-local-client}
            client-secret: ${GOOGLE_CLIENT_SECRET:import-local-secret}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
